[project]
name = "talkback-validator"
version = "0.1.0"
description = "Validates that Android TalkBack speaks the value shown on screen"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
cloud = ["google-genai>=0.3"]
capture = ["sounddevice>=0.4", "numpy>=1.26"]
ocr = ["pytesseract>=0.3"]

[project.scripts]
talkback-validator = "talkback_validator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkback_validator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
