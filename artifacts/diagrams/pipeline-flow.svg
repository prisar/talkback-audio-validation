<text x="40" y="30" font-size="22" font-weight="bold" fill="#1e1e1e">TalkBack audio validation — what was heard vs. what was shown</text>
<text x="40" y="52" font-size="14" fill="#495057">two independent observations of the same moment, reconciled by one deterministic function</text>
<text x="110.0" y="155.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#495057">Screen shows</text>
<text x="110.0" y="175.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#495057">a value</text>
<text x="305.0" y="155.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#1971c2">TalkBack reads</text>
<text x="305.0" y="175.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1971c2">the label</text>
<text x="495.0" y="155.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#1971c2">Phone</text>
<text x="495.0" y="175.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1971c2">speaker</text>
<text x="685.0" y="155.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#1971c2">Laptop</text>
<text x="685.0" y="175.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1971c2">microphone</text>
<text x="875.0" y="155.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#1971c2">WAV</text>
<text x="875.0" y="175.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1971c2">recording</text>
<text x="1065.0" y="155.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#1971c2">Speech model</text>
<text x="1065.0" y="175.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1971c2">(Gemini/Whisper)</text>
<text x="1265.0" y="155.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1971c2">Spoken</text>
<text x="1265.0" y="175.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1971c2">value</text>
<rect x="175.3" y="141.0" width="59.4" height="15" fill="#ffffff" opacity="0.9"/>
<text x="205.0" y="152.0" font-size="12" text-anchor="middle" fill="#495057">announces</text>
<rect x="388.5" y="141.0" width="33.0" height="15" fill="#ffffff" opacity="0.9"/>
<text x="405.0" y="152.0" font-size="12" text-anchor="middle" fill="#1971c2">plays</text>
<rect x="535.5" y="141.0" width="99.0" height="15" fill="#ffffff" opacity="0.9"/>
<text x="585.0" y="152.0" font-size="12" text-anchor="middle" fill="#1971c2">through the air</text>
<rect x="761.9" y="141.0" width="46.199999999999996" height="15" fill="#ffffff" opacity="0.9"/>
<text x="785.0" y="152.0" font-size="12" text-anchor="middle" fill="#1971c2">records</text>
<rect x="928.7" y="141.0" width="72.6" height="15" fill="#ffffff" opacity="0.9"/>
<text x="965.0" y="152.0" font-size="12" text-anchor="middle" fill="#1971c2">transcribes</text>
<rect x="1145.2" y="141.0" width="39.599999999999994" height="15" fill="#ffffff" opacity="0.9"/>
<text x="1165.0" y="152.0" font-size="12" text-anchor="middle" fill="#1971c2">parses</text>
<text x="505.0" y="315.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#e8590c">Screenshot</text>
<text x="505.0" y="335.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#e8590c">OCR</text>
<text x="505.0" y="395.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#e8590c">Accessibility</text>
<text x="505.0" y="415.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#e8590c">text node</text>
<text x="885.0" y="355.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#e8590c">Shown</text>
<text x="885.0" y="375.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#e8590c">value</text>
<rect x="147.4" y="199.6" width="66.0" height="15" fill="#ffffff" opacity="0.9"/>
<text x="180.4" y="210.6" font-size="12" text-anchor="middle" fill="#e8590c">screenshot</text>
<rect x="150.70000000000002" y="217.2" width="59.4" height="15" fill="#ffffff" opacity="0.9"/>
<text x="180.4" y="228.2" font-size="12" text-anchor="middle" fill="#e8590c">a11y tree</text>
<rect x="662.0" y="321.0" width="66.0" height="15" fill="#ffffff" opacity="0.9"/>
<text x="695.0" y="332.0" font-size="12" text-anchor="middle" fill="#e8590c">reads text</text>
<rect x="662.0" y="361.0" width="66.0" height="15" fill="#ffffff" opacity="0.9"/>
<text x="695.0" y="372.0" font-size="12" text-anchor="middle" fill="#e8590c">reads node</text>
<text x="1530.0" y="276.7" font-size="14" font-weight="bold" text-anchor="middle" fill="#6741d9">Python comparator</text>
<text x="1530.0" y="294.9" font-size="14" font-weight="bold" text-anchor="middle" fill="#6741d9">(deterministic, sees</text>
<text x="1530.0" y="313.09999999999997" font-size="14" font-weight="bold" text-anchor="middle" fill="#6741d9">both channels)</text>
<rect x="1381.0" y="206.0" width="33.0" height="15" fill="#ffffff" opacity="0.9"/>
<text x="1397.5" y="217.0" font-size="12" text-anchor="middle" fill="#6741d9">heard</text>
<rect x="1173.5" y="296.0" width="33.0" height="15" fill="#ffffff" opacity="0.9"/>
<text x="1190.0" y="307.0" font-size="12" text-anchor="middle" fill="#6741d9">shown</text>
<text x="1825.0" y="152.75" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f9e44">PASS</text>
<rect x="1679.6" y="167.85" width="92.39999999999999" height="15" fill="#ffffff" opacity="0.9"/>
<text x="1725.8" y="178.85" font-size="12" text-anchor="middle" fill="#2f9e44">channels agree</text>
<text x="1825.0" y="242.75" font-size="15" font-weight="bold" text-anchor="middle" fill="#e03131">FAIL</text>
<rect x="1669.7" y="238.05" width="112.19999999999999" height="15" fill="#ffffff" opacity="0.9"/>
<text x="1725.8" y="249.05" font-size="12" text-anchor="middle" fill="#e03131">channels disagree</text>
<text x="1825.0" y="332.75" font-size="15" font-weight="bold" text-anchor="middle" fill="#f08c00">INCONCLUSIVE</text>
<rect x="1673.0" y="308.25" width="105.6" height="15" fill="#ffffff" opacity="0.9"/>
<text x="1725.8" y="319.25" font-size="12" text-anchor="middle" fill="#f08c00">can't be decided</text>
<text x="1825.0" y="422.75" font-size="15" font-weight="bold" text-anchor="middle" fill="#495057">ERROR</text>
<rect x="1656.5" y="378.45" width="138.6" height="15" fill="#ffffff" opacity="0.9"/>
<text x="1725.8" y="389.45" font-size="12" text-anchor="middle" fill="#495057">capture untrustworthy</text>
</svg>